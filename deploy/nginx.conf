# Load balancer in front of two gateway instances.
#
# This is what makes the Phase 7 rate-limit claim meaningful: traffic is spread
# across both gateways, so a limit that held only per-instance would let roughly
# twice the configured rate through. The limit holding at its configured value
# is only interesting because these two processes share nothing but Redis.

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream gateways {
        # least_conn rather than round-robin: under a load test with varying
        # request costs, round-robin can queue requests behind a busy worker
        # while another sits idle, which would show up as latency the gateway
        # is not actually responsible for.
        least_conn;
        server gateway-1:8080 max_fails=3 fail_timeout=5s;
        server gateway-2:8080 max_fails=3 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The gateway echoes the correlation ID it assigned, and a client
            # that sent one expects it back unchanged.
            proxy_pass_request_headers on;

            # Generous enough not to cut off a slow checkout under load, short
            # enough that a hung upstream does not accumulate connections.
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
