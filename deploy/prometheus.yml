# Prometheus scrape configuration for the local stack.
#
# Every service exposes /metrics on its own port with a constant `service`
# label, so a single Prometheus can separate them (see pkg/metrics).

global:
  # 15s is the conventional default: fine enough to see a load test's shape in
  # Phase 7, coarse enough not to cost meaningful CPU on the services.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      # host.docker.internal reaches the host from inside the container, which
      # is how Prometheus finds services running with `go run` rather than in
      # compose. Phase 7 replaces these with container names once every service
      # has an image.
      - targets: ["host.docker.internal:8080"]
        labels:
          component: gateway

  - job_name: services
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: {component: auth}
      - targets: ["host.docker.internal:8082"]
        labels: {component: catalog}
      - targets: ["host.docker.internal:8083"]
        labels: {component: orders}
      - targets: ["host.docker.internal:8084"]
        labels: {component: payment}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
