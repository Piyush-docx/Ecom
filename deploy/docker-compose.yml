services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first initialized. They
      # create one database per service (see 01-create-databases.sql).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # A healthcheck matters here because the init scripts run after the
      # server first accepts connections, so "port is open" does not mean
      # "databases exist". Depending services wait on this.
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    # KRaft mode: no ZooKeeper. One container instead of two, and ZooKeeper is
    # removed entirely in Kafka 4.x, so this is the configuration that will
    # still be correct later.
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"
    environment:
      # Single-node cluster acting as both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Two advertised listeners because clients reach the broker from two
      # different networks: other containers use kafka:29092, while tests and
      # services on the host use localhost:9092. A single listener would work
      # for one and break the other.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Replication cannot exceed the single broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No consumer rebalance delay: with one consumer per group, waiting three
      # seconds on every startup only slows the test suite down.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-creation keeps local runs simple. Phase 7 should create topics
      # explicitly with a chosen partition count, since partitioning is what
      # gives per-order event ordering.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      # Listing topics proves the broker is actually serving metadata, which a
      # port check does not: Kafka accepts connections well before it is ready.
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  prometheus:
    # Scrapes the RED metrics every service exposes (IMPLEMENTATION_PLAN.md
    # Phase 6). Optional for the test suite, which asserts on /metrics directly,
    # but it is what makes the Phase 7 load test legible.
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach services running on the host with `go run`.
      # Native on Docker Desktop; declared explicitly so it also works on Linux.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
