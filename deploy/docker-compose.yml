services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first initialized. They
      # create one database per service (see 01-create-databases.sql).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # A healthcheck matters here because the init scripts run after the
      # server first accepts connections, so "port is open" does not mean
      # "databases exist". Depending services wait on this.
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
